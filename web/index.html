<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Viper Music - Clean, Minimal Netflix-themed Music Player">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Viper Music">
  <meta name="theme-color" content="#E50914">

  <title>Viper Music</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      color: #E50914;
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 24px;
      text-transform: uppercase;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(229, 9, 20, 0.2);
      border-top-color: #E50914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-container" id="loading">
    <div class="logo">VIPER MUSIC</div>
    <div class="spinner"></div>
  </div>

  <!-- Background Audio Player Engine -->
  <div id="yt-player-container" style="position:fixed; bottom:-500px; right:-500px; width:200px; height:200px; opacity:0; pointer-events:none; z-index:-999;">
    <div id="viper-yt-player"></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var viperYtPlayer = null;
    var viperPlayerReady = false;
    var viperPendingVideoId = null;

    function onYouTubeIframeAPIReady() {
      viperYtPlayer = new YT.Player('viper-yt-player', {
        height: '200',
        width: '200',
        playerVars: {
          'playsinline': 1,
          'controls': 0,
          'disablekb': 1,
          'fs': 0,
          'rel': 0,
          'autoplay': 1
        },
        events: {
          'onReady': function(e) {
            viperPlayerReady = true;
            if (viperPendingVideoId) {
              viperYtPlayer.loadVideoById(viperPendingVideoId);
              viperYtPlayer.playVideo();
            }
          }
        }
      });
    }

    window.viperPlaySong = function(videoId) {
      viperPendingVideoId = videoId;
      if (viperYtPlayer && viperPlayerReady && viperYtPlayer.loadVideoById) {
        viperYtPlayer.loadVideoById(videoId);
        viperYtPlayer.playVideo();
      }
    };

    window.viperPause = function() {
      if (viperYtPlayer && viperYtPlayer.pauseVideo) {
        viperYtPlayer.pauseVideo();
      }
    };

    window.viperResume = function() {
      if (viperYtPlayer && viperYtPlayer.playVideo) {
        viperYtPlayer.playVideo();
      }
    };

    window.viperSeek = function(seconds) {
      if (viperYtPlayer && viperYtPlayer.seekTo) {
        viperYtPlayer.seekTo(seconds, true);
      }
    };

    window.viperGetTime = function() {
      if (viperYtPlayer && viperYtPlayer.getCurrentTime) {
        return viperYtPlayer.getCurrentTime() || 0;
      }
      return 0;
    };

    window.viperGetDuration = function() {
      if (viperYtPlayer && viperYtPlayer.getDuration) {
        return viperYtPlayer.getDuration() || 0;
      }
      return 0;
    };

    window.viperGetState = function() {
      if (viperYtPlayer && viperYtPlayer.getPlayerState) {
        return viperYtPlayer.getPlayerState();
      }
      return -1;
    };
  </script>

  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: {{flutter_service_worker_version}},
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            var loader = document.getElementById('loading');
            if (loader) loader.remove();
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
