  <style>

:root{--bg:#000;--hint:#777;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--hint:#777}}
:root[data-theme="dark"]{--bg:#000;--hint:#777}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.stage{width:92vw;max-width:880px;cursor:pointer}
svg{width:100%;height:auto;display:block;overflow:visible}
p{color:var(--hint);font-size:13px;margin:28px 0 0;letter-spacing:.04em}
#logo,#logo *{transform-box:fill-box}
#logo{animation:out 4.2s linear infinite both}
@keyframes out{0%,85.7%{opacity:1;transform:translateY(0);animation-timing-function:cubic-bezier(.5,0,.8,.4)}94.3%,100%{opacity:0;transform:translateY(14px)}}
/* M pieces */
.mL{transform-origin:50% 100%;animation:aL 4.2s infinite both}
.mR{transform-origin:50% 100%;animation:aR 4.2s infinite both}
@keyframes aL{0%,4%{transform:scaleY(0);animation-timing-function:cubic-bezier(.22,.8,.24,1)}15%,100%{transform:scaleY(1)}}
@keyframes aR{0%,6%{transform:scaleY(0);animation-timing-function:cubic-bezier(.22,.8,.24,1)}17%,100%{transform:scaleY(1)}}
.mB{animation:aB 4.2s infinite both}
@keyframes aB{0%,8%{opacity:0;transform:translate(-90px,-140px);animation-timing-function:cubic-bezier(.22,.8,.24,1)}19%,100%{opacity:1;transform:none}}
.mM{animation:aM 4.2s infinite both}
@keyframes aM{0%,10%{opacity:0;transform:translate(90px,-140px);animation-timing-function:cubic-bezier(.22,.8,.24,1)}21%,100%{opacity:1;transform:none}}
/* letters */
.l{animation:rise 4.2s infinite both}
@keyframes rise{0%,18%{opacity:0;transform:translateY(70px);animation-timing-function:cubic-bezier(.22,.8,.24,1)}30%,100%{opacity:1;transform:none}}
.l2{animation-name:rise2}.l3{animation-name:rise3}.l4{animation-name:rise4}
@keyframes rise2{0%,20%{opacity:0;transform:translateY(70px);animation-timing-function:cubic-bezier(.22,.8,.24,1)}32%,100%{opacity:1;transform:none}}
@keyframes rise3{0%,22%{opacity:0;transform:translateY(70px);animation-timing-function:cubic-bezier(.22,.8,.24,1)}34%,100%{opacity:1;transform:none}}
@keyframes rise4{0%,24%{opacity:0;transform:translateY(70px);animation-timing-function:cubic-bezier(.22,.8,.24,1)}36%,100%{opacity:1;transform:none}}
/* sound bars: pop in, then bounce like an equalizer */
.bar{animation:pop 4.2s infinite both;transform-origin:50% 50%}
.b2,.b3{animation-delay:0s}
@keyframes pop{0%,30%{opacity:0;transform:scaleY(0);animation-timing-function:cubic-bezier(.22,.8,.24,1.2)}44%,100%{opacity:1;transform:scaleY(1)}}
.eq{transform-origin:50% 50%;animation:eq .9s ease-in-out infinite alternate}
.e0{animation-duration:.7s}.e1{animation-duration:.95s;animation-delay:-.3s}.e2{animation-duration:.8s;animation-delay:-.5s}
.e3{animation-duration:.85s;animation-delay:-.2s}.e4{animation-duration:1s;animation-delay:-.6s}.e5{animation-duration:.75s;animation-delay:-.4s}
@keyframes eq{0%{transform:scaleY(.55)}100%{transform:scaleY(1.12)}}
.shine{animation:sh 4.2s cubic-bezier(.4,0,.3,1) infinite both}
@keyframes sh{0%,48%{transform:translateX(0);opacity:0}49%{opacity:1}60%{opacity:1}61%,100%{transform:translateX(2200px);opacity:0}}
@media (prefers-reduced-motion:reduce){#logo *{animation:none!important;opacity:1!important;transform:none!important}.shine{display:none}}


    /* Custom Loading Overlay */
    #loading {
      position: fixed;
      inset: 0;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.5s ease;
    }
    .stage {
      width: 85vw;
      max-width: 650px;
    }

  <!-- Background Audio Player Engine -->
  <div id="yt-player-container" style="position:fixed; bottom:-500px; right:-500px; width:200px; height:200px; opacity:0; pointer-events:none; z-index:-999;">
    <div id="viper-yt-player"></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var viperYtPlayer = null;
    var viperPlayerReady = false;
    var viperPendingVideoId = null;

    function onYouTubeIframeAPIReady() {
      viperYtPlayer = new YT.Player('viper-yt-player', {
        height: '200',
        width: '200',
        playerVars: {
          'playsinline': 1,
          'controls': 0,
          'disablekb': 1,
          'fs': 0,
          'rel': 0,
          'autoplay': 1
        },
        events: {
          'onReady': function(e) {
            viperPlayerReady = true;
            if (viperPendingVideoId) {
              viperYtPlayer.loadVideoById(viperPendingVideoId);
              viperYtPlayer.playVideo();
            }
          }
        }
      });
    }

    window.viperPlaySong = function(videoId) {
      viperPendingVideoId = videoId;
      if (viperYtPlayer && viperPlayerReady && viperYtPlayer.loadVideoById) {
        viperYtPlayer.loadVideoById(videoId);
        viperYtPlayer.playVideo();
      }
    };

    window.viperPause = function() {
      if (viperYtPlayer && viperYtPlayer.pauseVideo) {
        viperYtPlayer.pauseVideo();
      }
    };

    window.viperResume = function() {
      if (viperYtPlayer && viperYtPlayer.playVideo) {
        viperYtPlayer.playVideo();
      }
    };

    window.viperSeek = function(seconds) {
      if (viperYtPlayer && viperYtPlayer.seekTo) {
        viperYtPlayer.seekTo(seconds, true);
      }
    };

    window.viperGetTime = function() {
      if (viperYtPlayer && viperYtPlayer.getCurrentTime) {
        return viperYtPlayer.getCurrentTime() || 0;
      }
      return 0;
    };

    window.viperGetDuration = function() {
      if (viperYtPlayer && viperYtPlayer.getDuration) {
        return viperYtPlayer.getDuration() || 0;
      }
      return 0;
    };

    window.viperGetState = function() {
      if (viperYtPlayer && viperYtPlayer.getPlayerState) {
        return viperYtPlayer.getPlayerState();
      }
      return -1;
    };
  </script>

  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: {{flutter_service_worker_version}},
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            var loader = document.getElementById('loading');
            if (loader) {
              loader.style.opacity = '0';
              setTimeout(function() { loader.remove(); }, 500);
            }
            appRunner.runApp();
          });
        }
      });
    });
  </script>
